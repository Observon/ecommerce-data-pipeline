name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_dw
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ecommerce -d ecommerce_dw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Apply operational schema
        env:
          PGPASSWORD: ecommerce
        run: psql -h localhost -U ecommerce -d ecommerce_dw -f sql/00_operational_schema.sql

      - name: Build and load sample data
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ecommerce_dw
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        run: python -m src.pipeline --raw-directory data/raw/sample --load-postgres

      - name: Apply analytical schema
        env:
          PGPASSWORD: ecommerce
        run: psql -h localhost -U ecommerce -d ecommerce_dw -f sql/02_analytics_schema.sql

      - name: Run tests
        env:
          POSTGRES_INTEGRATION: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ecommerce_dw
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        run: python -m pytest -q